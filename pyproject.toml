[project]
name = "chess-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ioannistassioulas", email = "i.a.tassioulas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cairosvg>=2.9.0",
    "chess>=1.11.2",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
]

[project.scripts]
chess-engine = "chess_engine:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://github.com/ioannistassioulas/chess-engine"
Issues = "https://github.com/ioannistassioulas/chess-engine/issues"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["chess_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

license-files = ["LICENSE"]
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
